spring.application.name=tictactoe

spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:batch1_2026_trainees}
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:127.0.0.1:9042}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DATACENTER:datacenter1}

app.allowed-origin-patterns=http://localhost:*

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always